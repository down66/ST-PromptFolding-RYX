<div id="pf-settings-panel" class="range-block marginBot10" style="display: none; width: 100%; box-sizing: border-box;">
    <div class="inline-drawer-content" style="display: block;">

        <div style="position: relative;">
            <h3 style="margin: 0;">Fold Settings</h3>
            <span id="pf-reset-icon" class="pf-help-icon" style="right: 26px;" title="Reset all settings"><i class="fa-solid fa-rotate-left" style="font-size: 11px;"></i></span>
            <span class="pf-help-icon" title="A plugin that organizes your Prompt Manager into clean, collapsible groups.&#10;&#10;Style inspired by riyuexi's clean group design.&#10;Architecture based on ST-PromptFolding by mingyu.">?</span>
        </div>

        <div id="pf-mode-radios" class="flex-container flexFlowColumn" style="gap: 10px; align-items: flex-start; margin-bottom: 15px;">

            <!-- Manual Selection (Recommended) -->
            <label class="radio_label" title="Manual: Check the entries you want as folder headers" style="width: 100%; padding: 8px; background: rgba(74, 158, 255, 0.1); border-radius: 4px;">
                <input type="radio" name="folding-mode" value="manual" id="pf-mode-manual">
                <span style="font-weight: 500;">Manual Selection <small style="color: #4a9eff;">(Recommended)</small></span>
            </label>

            <!-- Legacy Modes -->
            <details id="pf-legacy-modes" style="width: 100%;">
                <summary style="font-size: 11px; opacity: 0.4; cursor: pointer; list-style: none; user-select: none;">Legacy Modes</summary>
                <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px;">
                    <label class="radio_label" title="Standard: A header followed by all subsequent items" style="width: 100%; opacity: 0.7;">
                        <input type="radio" name="folding-mode" value="standard" id="pf-mode-standard">
                        <span>Standard Mode <small>(needs divider symbols)</small></span>
                    </label>
                    <label class="radio_label" title="Sandwich: Matching pairs of headers wrapping content" style="width: 100%; opacity: 0.7;">
                        <input type="radio" name="folding-mode" value="sandwich" id="pf-mode-sandwich">
                        <span>Sandwich Mode <small>(needs divider symbols)</small></span>
                    </label>
                </div>
            </details>
        </div>

        <!-- Divider Settings -->
        <div id="pf-divider-settings" style="margin-bottom: 15px;">
            <div style="position: relative; margin-bottom: 8px;">
                <label for="pf-dividers-input">
                    <span>Divider Symbols (one per line)</span>
                </label>
                <span class="pf-help-icon" title="Enter symbols/text that mark group headers.&#10;&#10;Examples:&#10;- Enter '=' to match prompts starting with '='&#10;- Enter '---' to match prompts starting with '---'">?</span>
            </div>
            <textarea id="pf-dividers-input" class="text_pole textarea_compact" rows="4" placeholder="=&#10;-"></textarea>
        </div>

        <!-- Manual Selection Button -->
        <div id="pf-manual-controls" style="display: none; margin-bottom: 15px;">
            <div class="flex-container justifyCenter">
                <div id="pf-start-select" class="menu_button menu_button_icon" style="background: rgba(74, 158, 255, 0.2);" title="Click to show checkboxes on each entry. Select which ones to use as folder headers.">
                    <i class="fa-solid fa-hand-pointer"></i> Start Selecting Folders
                </div>
            </div>
        </div>

        <!-- Cross-Preset Copy -->
        <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
            <div style="position: relative; margin-bottom: 10px;">
                <h4 style="margin: 0; font-size: 13px;">Copy Config from Other Preset</h4>
                <span class="pf-help-icon" title="Copy folding configuration from another Preset to the current one.&#10;&#10;Entries are matched by UUID, so the same entry across presets will be correctly matched.">?</span>
            </div>
            <div class="flex-container" style="gap: 8px; align-items: center;">
                <select id="pf-copy-from-preset" class="text_pole" style="flex: 1;">
                    <option value="">(Loading...)</option>
                </select>
                <div id="pf-copy-config-btn" class="menu_button menu_button_icon" style="flex-shrink: 0;">
                    <i class="fa-solid fa-copy"></i> Copy
                </div>
            </div>
            <small style="display: block; margin-top: 8px; opacity: 0.7; font-size: 11px;">
                Copies: folding mode, divider settings, manually selected folders
            </small>
        </div>

        <!-- Debug & Fold Settings Toggles -->
        <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 16px;">
            <label class="checkbox_label" style="display: flex; align-items: center; cursor: pointer; opacity: 0.7;">
                <input type="checkbox" id="pf-debug-mode" style="margin-right: 8px;">
                <small>Debug Mode</small>
            </label>
            <label class="checkbox_label" style="display: flex; align-items: center; cursor: pointer; opacity: 0.7;">
                <input type="checkbox" id="pf-fold-settings" style="margin-right: 8px;">
                <small>Fold API Settings</small>
            </label>
        </div>

        <div id="pf-version-info"></div>
    </div>
</div>
